<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth - OTP Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 48px 40px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .logo p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .otp-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }

        .otp-section.expired {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        .otp-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .otp-display {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-bottom: 16px;
            transition: color 0.3s;
            user-select: all;
        }

        .otp-display.expired {
            color: #ef4444;
            text-decoration: line-through;
        }

        .otp-display.hidden {
            color: rgba(255, 255, 255, 0.15);
        }

        .timer-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .timer-bar.warning {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        .timer-bar.expired {
            background: #ef4444;
            width: 0% !important;
        }

        .timer-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .timer-text .time-value {
            font-weight: 600;
            color: #667eea;
        }

        .timer-text .time-value.warning {
            color: #f59e0b;
        }

        .timer-text .time-value.expired {
            color: #ef4444;
        }

        .otp-input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .otp-input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.2s;
        }

        .otp-input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            margin-bottom: 0;
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .status-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .status-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .refresh-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #667eea;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .refresh-link:hover {
            color: #8b9cf7;
            text-decoration: underline;
        }

        .refresh-link svg {
            width: 14px;
            height: 14px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .initial-state {
            padding: 20px 0;
        }

        .initial-state p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.8 1.1 2.8 2.5V11c.6 0 1.2.6 1.2 1.3v3.5c0 .6-.6 1.2-1.3 1.2H9.2c-.6 0-1.2-.6-1.2-1.3v-3.5c0-.6.6-1.2 1.3-1.2V9.5C9.2 8.1 10.6 7 12 7zm0 1.2c-.8 0-1.5.7-1.5 1.3V11h3V9.5c0-.7-.7-1.3-1.5-1.3z"/></svg>
            </div>
            <h1>SecureAuth</h1>
            <p>Two-factor authentication</p>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" value="••••••••">
        </div>

        <div class="otp-section" id="otp-section">
            <div id="initial-state" class="initial-state">
                <p>Click below to generate your one-time password</p>
                <button class="btn btn-generate" onclick="generateOTP()">Generate OTP</button>
            </div>

            <div id="otp-active" style="display: none;">
                <div class="otp-label">Your One-Time Password</div>
                <div class="otp-display" id="otp-display">------</div>
                <div class="timer-bar-container">
                    <div class="timer-bar" id="timer-bar"></div>
                </div>
                <div class="timer-text">
                    Expires in <span class="time-value" id="timer-text">30s</span>
                </div>
                <button class="refresh-link" onclick="generateOTP()">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Generate new OTP
                </button>
            </div>
        </div>

        <div class="form-group">
            <label>Enter OTP</label>
            <div class="otp-input-group">
                <input type="text" class="otp-input" maxlength="1" data-index="0">
                <input type="text" class="otp-input" maxlength="1" data-index="1">
                <input type="text" class="otp-input" maxlength="1" data-index="2">
                <input type="text" class="otp-input" maxlength="1" data-index="3">
                <input type="text" class="otp-input" maxlength="1" data-index="4">
                <input type="text" class="otp-input" maxlength="1" data-index="5">
            </div>
        </div>

        <button class="btn btn-primary" id="login-btn" onclick="submitLogin()" disabled>
            Sign In
        </button>

        <div class="status-message" id="status-message"></div>
    </div>

    <script>
        let currentSessionId = null;
        let currentOTP = null;
        let expiryTime = null;
        let timerInterval = null;
        let otpExpirySeconds = 30;

        // OTP input handling
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                checkFormComplete();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                for (let i = 0; i < Math.min(paste.length, otpInputs.length); i++) {
                    otpInputs[i].value = paste[i];
                }
                checkFormComplete();
                otpInputs[Math.min(paste.length, otpInputs.length) - 1].focus();
            });
        });

        function checkFormComplete() {
            const username = document.getElementById('username').value.trim();
            const otpComplete = Array.from(otpInputs).every(input => input.value);
            document.getElementById('login-btn').disabled = !(username && otpComplete && currentSessionId);
        }

        document.getElementById('username').addEventListener('input', checkFormComplete);

        async function generateOTP() {
            // Clear existing timer
            if (timerInterval) clearInterval(timerInterval);

            // Clear OTP inputs
            otpInputs.forEach(input => input.value = '');

            // Show loading state
            const otpDisplay = document.getElementById('otp-display');
            otpDisplay.textContent = '......';
            otpDisplay.className = 'otp-display';

            document.getElementById('initial-state').style.display = 'none';
            document.getElementById('otp-active').style.display = 'block';
            document.getElementById('otp-section').classList.remove('expired');

            // Clear status
            const statusEl = document.getElementById('status-message');
            statusEl.className = 'status-message';
            statusEl.style.display = 'none';

            try {
                const response = await fetch('/api/generate-otp', { method: 'POST' });
                const data = await response.json();

                currentSessionId = data.session_id;
                currentOTP = data.otp;
                otpExpirySeconds = data.expires_in;
                expiryTime = (data.created_at + data.expires_in) * 1000;

                otpDisplay.textContent = currentOTP;
                startTimer();
                checkFormComplete();
            } catch (err) {
                otpDisplay.textContent = 'ERROR';
                console.error('Failed to generate OTP:', err);
            }
        }

        function startTimer() {
            const timerBar = document.getElementById('timer-bar');
            const timerText = document.getElementById('timer-text');
            const otpDisplay = document.getElementById('otp-display');

            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = Math.max(0, (expiryTime - now) / 1000);
                const pct = (remaining / otpExpirySeconds) * 100;

                timerBar.style.width = pct + '%';

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerText.textContent = 'EXPIRED';
                    timerText.className = 'time-value expired';
                    timerBar.classList.add('expired');
                    otpDisplay.classList.add('expired');
                    document.getElementById('otp-section').classList.add('expired');
                    document.getElementById('login-btn').disabled = true;
                } else if (remaining <= 10) {
                    timerText.textContent = remaining.toFixed(1) + 's';
                    timerText.className = 'time-value warning';
                    timerBar.classList.add('warning');
                } else {
                    timerText.textContent = Math.ceil(remaining) + 's';
                    timerText.className = 'time-value';
                    timerBar.classList.remove('warning');
                }
            }, 100);
        }

        async function submitLogin() {
            const btn = document.getElementById('login-btn');
            const statusEl = document.getElementById('status-message');
            const username = document.getElementById('username').value.trim();
            const submittedOTP = Array.from(otpInputs).map(i => i.value).join('');

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Verifying...';

            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        otp: submittedOTP,
                        username: username,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    statusEl.className = 'status-message success';
                    statusEl.textContent = data.message;
                    statusEl.style.display = 'block';
                    if (timerInterval) clearInterval(timerInterval);
                } else {
                    statusEl.className = 'status-message error';
                    statusEl.textContent = data.error;
                    statusEl.style.display = 'block';
                    btn.disabled = false;
                }
            } catch (err) {
                statusEl.className = 'status-message error';
                statusEl.textContent = 'Network error. Please try again.';
                statusEl.style.display = 'block';
                btn.disabled = false;
            }

            btn.innerHTML = 'Sign In';
        }
    </script>
</body>
</html>
